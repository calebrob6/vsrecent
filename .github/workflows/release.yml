name: release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ${{ matrix.rid }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "publish/${{ matrix.rid }}"
          cp "target/${{ matrix.target }}/release/vsrecent.exe" \
             "publish/${{ matrix.rid }}/vsrecent-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: vsrecent-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/vsrecent-${{ matrix.rid }}.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
