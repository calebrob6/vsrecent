name: release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ${{ matrix.rid }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "publish/${{ matrix.rid }}"
          cp "target/${{ matrix.target }}/release/vsrecent.exe" \
             "publish/${{ matrix.rid }}/vsrecent-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: vsrecent-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/vsrecent-${{ matrix.rid }}.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      # A debug build keeps the Objective-C bindings' runtime checks of every message signature.
      - name: Smoke test debug build
        run: |
          cargo build --locked
          sh scripts/smoke-test-macos.sh target/debug/vsrecent publish/screenshots/macos-light.png --light

      - name: Build macos-universal
        run: sh build-macos.sh

      - name: Smoke test application bundle
        run: |
          lipo -archs "publish/VS Recent.app/Contents/MacOS/vsrecent"
          codesign --verify --strict --verbose=2 "publish/VS Recent.app"
          sh scripts/smoke-test-macos.sh "publish/VS Recent.app/Contents/MacOS/vsrecent" \
            publish/screenshots/macos-dark.png --dark

      - uses: actions/upload-artifact@v4
        with:
          name: vsrecent-macos-universal
          path: publish/vsrecent-macos-universal.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: publish/screenshots/*.png
          if-no-files-found: warn

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsrecent-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
