[package]
name = "vsrecent"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Instant native launcher for recent VS Code folders on Windows and macOS"
repository = "https://github.com/calebrob6/vsrecent"

[dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScrollView",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWindowRestoration",
    "NSWorkspace",
] }

# Build dependencies are resolved against the host, so this is only compiled
# when building on Windows.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
